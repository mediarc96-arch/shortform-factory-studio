name: sfs-console

services:
  sfs-console-api:
    container_name: sfs-console-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - /opt/infra/postgres14/.env
    environment:
      SFS_WORKSPACE_ROOT: /workspace/shortform-factory-studio
      SFS_DB_HOST: postgres14
      SFS_DB_NAME: shortform_factory
      SFS_DB_PORT: 5432
      PAPERCLIP_BASE_URL: ${PAPERCLIP_BASE_URL:-https://pc.devscent.com}
      PAPERCLIP_API_TOKEN: ${PAPERCLIP_API_TOKEN:-}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID:-}
      PAPERCLIP_PROJECT_ID: ${PAPERCLIP_PROJECT_ID:-}
    ports:
      - "${SFS_API_BIND:-127.0.0.1}:${SFS_API_PORT:-8002}:8000"
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases:
          - sfs-console-api
    volumes:
      - type: bind
        source: .
        target: /workspace/shortform-factory-studio
        read_only: true
      - type: bind
        source: ./characters
        target: /workspace/shortform-factory-studio/characters
        read_only: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    container_name: sfs-console-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      sfs-console-api:
        condition: service_healthy
    environment:
      SFS_API_BASE_URL: http://sfs-console-api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${SFS_WEB_BIND:-127.0.0.1}:${SFS_WEB_PORT:-3002}:3000"
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases:
          - sfs-console-web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/ko/production', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  edge:
    external: true
